name: Controlli

# Gira su ogni PR verso develop e main. La build del sito la fa già Vercel
# (anteprima su ogni PR), qui controlliamo tipi, lint e test del codice dei moduli.
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Controllo dei tipi
        run: npm run typecheck
      - name: Controllo dello stile del codice
        run: npm run lint
      - name: Test
        run: npm test
